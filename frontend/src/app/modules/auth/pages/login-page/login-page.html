<div class="auth-form-container">
    <form class="auth-form" (ngSubmit)="login()" [formGroup]="form">
        <header class="auth-form__header">
            <picture>
                <!-- <img class="auth-form__logo" src="/logos/ipsos-logo.png" /> -->
            </picture>
            <h2 class="auth-form__title">Bienvenido</h2>
        </header>
        <div class="auth-form__body">
            <label class="form-field" for="email">
                <span class="form-field__label">Email</span>
                <input id="email" type="email" class="form-field__input" formControlName="email"/>
            </label>
            <label class="form-field" for="password">
                <span class="form-field__label">Contraseña</span>
                <input id="password" type="password" class="form-field__input" formControlName="password"/>
            </label>
        </div>
        <div class="auth-form__buttons">
            <button class="button button-primary">Iniciar sesión</button>
        </div>
        <p class="auth-form__helper">
            <span>¿No tienes una cuenta?</span>
            <a class="auth-form__link" routerLink="/auth/register">Crear cuenta</a>
        </p>
    </form>
</div>
