<div class="auth-form-container">
	<form class="auth-form" [formGroup]="form" (ngSubmit)="register()">
		<header class="auth-form__header">
            <picture>
                <svg width="56" height="56" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M20 0C27.4768 0 31.2154 -0.000204921 34 1.60742C35.8242 2.66064 37.3394 4.17577 38.3926 6C40.0002 8.7846 40 12.5232 40 20C40 27.4768 40.0002 31.2154 38.3926 34C37.3394 35.8242 35.8242 37.3394 34 38.3926C31.2154 40.0002 27.4768 40 20 40C12.5232 40 8.7846 40.0002 6 38.3926C4.17577 37.3394 2.66064 35.8242 1.60742 34C-0.000204921 31.2154 0 27.4768 0 20C0 12.5232 -0.000204921 8.7846 1.60742 6C2.66064 4.17577 4.17577 2.66064 6 1.60742C8.7846 -0.000204921 12.5232 0 20 0ZM22 4C13.1634 4 6 11.1634 6 20C6 28.8366 13.1634 36 22 36C30.8366 36 38 28.8366 38 20C38 11.1634 30.8366 4 22 4Z" fill="#FF4D00"></path>
                    <path d="M36 20C36 25.5228 31.5228 30 26 30C20.4772 30 16 25.5228 16 20C16 14.4772 20.4772 10 26 10C31.5228 10 36 14.4772 36 20Z" fill="#FF4D00"></path>
                </svg>
            </picture>
			<h2 class="auth-form__title">Crear cuenta</h2>
		</header>
		<div class="auth-form__body">
			<div class="auth-form__row">
				<label class="form-field" for="userName">
					<span class="form-field__label">Nombre de Usuario</span>
					<input id="userName" type="text" class="form-field__input" formControlName="userName" />
					@if (controlInvalid('userName')) {
						<span class="form-field__error">Ingresa un nombre de usuario válido.</span>
					}
				</label>
			</div>
			<label class="form-field" for="registerEmail">
				<span class="form-field__label">Email</span>
				<input id="registerEmail" type="email" class="form-field__input" formControlName="email" />
				@if (controlInvalid('email')) {
					<span class="form-field__error">Ingresa un email válido.</span>
				}
			</label>
			<label class="form-field" for="registerPassword">
				<span class="form-field__label">Contraseña</span>
				<input id="registerPassword" type="password" class="form-field__input" formControlName="password" />
				@if (controlInvalid('password')) {
					<span class="form-field__error">La contraseña debe tener al menos 8 caracteres.</span>
				}
			</label>
			<label class="form-field" for="confirmPassword">
				<span class="form-field__label">Confirmar contraseña</span>
				<input id="confirmPassword" type="password" class="form-field__input" formControlName="confirmPassword" />
				@if ((controlInvalid('confirmPassword') || passwordsDoNotMatch()) && form.controls.confirmPassword.touched) {
					<span class="form-field__error">Las contraseñas no coinciden.</span>
				}
			</label>
		</div>
		<div class="auth-form__buttons">
			<app-button 
				[fullWidth]="true" 
				type="submit" 
				[isLoading]="isSubmitting()"
				[disabled]="form.invalid"
			>Crear cuenta</app-button>
		</div>
		<p class="auth-form__helper">
			<span>¿Ya tienes una cuenta?</span>
			<a class="auth-form__link" routerLink="/auth/login">Inicia sesión</a>
		</p>
	</form>
</div>
