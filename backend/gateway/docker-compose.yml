services:
  gateway-webapi:
    image: ${DOCKER_REGISTRY-}gateway-webapi
    container_name: gateway-webapi
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: src/WebApi/Dockerfile
    ports:
      - 6000:8080
  
  users-webapi:
    image: ${DOCKER_REGISTRY-}users-webapi
    container_name: users-webapi
    env_file:
      - ../users/.env
    build:
      context: ../users
      dockerfile: src/WebApi/Dockerfile
    depends_on:
      postgres-users:
        condition: service_healthy
    ports:
      - 6010:8080
  orders-webapi:
    image: ${DOCKER_REGISTRY-}orders-webapi
    container_name: orders-webapi
    env_file:
      - ../orders/.env
    build:
      context: ../orders
      dockerfile: src/WebApi/Dockerfile
    depends_on:
      postgres-orders:
        condition: service_healthy
    ports:
      - 6020:8080
  payments-webapi:
    image: ${DOCKER_REGISTRY-}payments-webapi
    container_name: payments-webapi
    env_file:
      - ../payments/.env
    build:
      context: ../payments
      dockerfile: src/WebApi/Dockerfile
    depends_on:
      postgres-payments:
        condition: service_healthy
    ports:
      - 6030:8080
  postgres-users:
    image: postgres:17
    container_name: postgres-users
    env_file:
      - ../users/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./.containers/users/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
  postgres-orders:
    image: postgres:17
    container_name: postgres-orders
    env_file:
      - ../orders/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./.containers/orders/db:/var/lib/postgresql/data         
    ports:
      - 5433:5432
  postgres-payments:
    image: postgres:17
    container_name: postgres-payments
    env_file:
      - ../payments/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./.containers/payments/db:/var/lib/postgresql/data        
    ports:
      - 5434:5432
