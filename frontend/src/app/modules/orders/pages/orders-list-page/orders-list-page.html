<div class="orders-page">
  <div class="orders-page__header">
    <h1 class="orders-page__title">Mis Pedidos</h1>
    <p class="orders-page__subtitle">Historial de tus pedidos realizados</p>
  </div>

  <div class="orders-page__content">
    @if (orders.value().length === 0) {
      <div class="orders-page__empty">
        <span class="orders-page__empty-icon material-symbols-outlined" aria-hidden="true">receipt_long</span>
        <p class="orders-page__empty-text">Aún no tienes pedidos realizados</p>
        <a routerLink="/products" class="orders-page__empty-link">Ir a productos</a>
      </div>
    } @else {
      <div class="orders-page__list">
        @for (order of orders.value(); track order.id) {
          <app-order-card 
            [order]="order" 
            (payOrder)="handlePayOrder($event)"
          />
        }
      </div>
    }
  </div>
</div>
