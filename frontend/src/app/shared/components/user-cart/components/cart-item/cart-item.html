<div class="cart-item">
  <img 
    class="cart-item__image" 
    [src]="+item().productId | productImage" 
    [alt]="item().productName"
    loading="lazy"
    (error)="$event.target.src='https://via.placeholder.com/80x80?text=Sin+Imagen'"
  />
  
  <div class="cart-item__details">
    <h4 class="cart-item__name">{{ item().productName }}</h4>
    <span class="cart-item__price">{{ item().unitPrice | currency:'':'symbol':'1.0-0' }}</span>
  </div>

  <div class="cart-item__actions">
    <div class="cart-item__quantity-control">
      <button 
        type="button"
        class="cart-item__quantity-btn"
        (click)="handleDecrease()"
        [attr.aria-label]="'Disminuir cantidad de ' + item().productName"
      >
        <lucide-angular name="minus" [size]="14" aria-hidden="true"></lucide-angular>
      </button>
      
      <span class="cart-item__quantity" aria-label="Cantidad">{{ item().quantity }}</span>
      
      <button 
        type="button"
        class="cart-item__quantity-btn"
        (click)="handleIncrease()"
        [attr.aria-label]="'Aumentar cantidad de ' + item().productName"
      >
        <lucide-angular name="plus" [size]="14" aria-hidden="true"></lucide-angular>
      </button>
    </div>

    <button 
      type="button"
      class="cart-item__remove-btn"
      (click)="handleRemove()"
      [attr.aria-label]="'Eliminar ' + item().productName + ' del carrito'"
    >
      <lucide-angular name="trash-2" [size]="16" aria-hidden="true"></lucide-angular>
    </button>
  </div>
</div>
