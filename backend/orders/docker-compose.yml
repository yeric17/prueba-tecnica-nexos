services:
  orders-webapi:
    image: ${DOCKER_REGISTRY-}orders-webapi
    container_name: orders-webapi
    build:
      context: .
      dockerfile: src/WebApi/Dockerfile
    depends_on:
      postgres-orders:
        condition: service_healthy
    ports:
      - 5000:8080
  postgres-orders:
    image: postgres:17
    container_name: postgres-orders
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
