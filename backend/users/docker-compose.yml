services:
  users-webapi:
    image: ${DOCKER_REGISTRY-}users-webapi
    container_name: users-webapi
    build:
      context: .
      dockerfile: src/WebApi/Dockerfile
    depends_on:
      postgres-users:
        condition: service_healthy
    ports:
      - 5000:8080

  postgres-users:
    image: postgres:17
    container_name: postgres-users
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
